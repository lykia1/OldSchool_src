quest (2000)
{
	BASIC_INFO				# Standard information
	{
		QUEST_EPISODE_TYPE = $QUEST_EPISODE_TYPE_1And2;
		QUEST_INDEX				= 2000;
		QUEST_NAME				= $QUEST_2000_QUEST_NAME;
		QUEST_KIND			= $QUEST_KIND_SCENARIO; #Scenario mission
		QUEST_TYPE				= $QUEST_TYPE_SERIES;
		QUEST_START_TYPE		= $QUEST_START_TYPE_MEET_NPC;
		QUEST_END_TYPE			= $QUEST_END_TYPE_REQESTED_BY_CLIENT;
		QUEST_NPC_INFO
		{
			NPC_INDEX			= 3;#Diego
			PRE_TALK			= $QUEST_2000_PRE_TALK;
			MID_TALK			= $QUEST_2000_MID_TALK;
			SUCCESS_TALK			= $QUEST_2000_SUCCESS_TALK;
			FAIL_TALK			= '';
		};
		DESCRIPTION				= $QUEST_2000_DESCRIPTION;
		
		NEXT_QUEST_INDEX		= 2001;
	};

	START_REQ				# Quest start condition
	{
		S_REQ_INFLUENCE_TYPE	= 2;
		S_REQ_UNIT_KIND			= $UNITKIND_ALL;
		S_REQ_LEVEL				= (98~);
		S_REQ_QUEST_INDEX		= 170;
	};

	START_ACTION			# Action taken to the character when starting the mission
	{
		S_START_MAP_INDEX		=3017; #루메인 화산
		S_START_PARTY_WARP_FLAG = TRUE; # 편대원 모두 미션맵으로 워프됨
	};

	COMPLETION_REQ		# Quest success condition
	{
		C_REQ_MEET_OBJ_INDEX	=  1005 AREA 4100; # 루메인화산에서 1005번 이벤트 오브젝트와 충돌시 미션종료 
	};

	COMPLETION_ACTION		# Action taken to the character when quest has been successfully finished
	{	
		C_PAY_ITEM				= $SPI(2499528);
		C_PAY_EXPERIENCE			= 27920565;
	};
};

